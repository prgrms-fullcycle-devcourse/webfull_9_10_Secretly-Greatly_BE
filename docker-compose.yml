services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secretly-greatly-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      redis :
          condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: secretly-greatly-redis
    ports:
      - "6379:6379"    
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
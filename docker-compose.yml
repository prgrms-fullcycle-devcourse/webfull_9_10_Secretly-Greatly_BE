services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secretly-greatly-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: secretly-greatly-redis
    ports:
      - "6379:6379"    
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes   # 디스크 영속화(재시작해도 캐시 유지)

volumes:
  redis-data:
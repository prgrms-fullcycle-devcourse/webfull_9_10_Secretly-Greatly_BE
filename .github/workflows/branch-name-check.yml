name: Branch Name Check

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [develop, main]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "검사할 브랜치명: $BRANCH"

          # develop -> main 같은 보호 브랜치 간 PR은 검사 제외
          if [ "$BRANCH" = "develop" ] || [ "$BRANCH" = "main" ]; then
            echo "✅ 보호 브랜치($BRANCH) PR이므로 명명 규칙 검사를 건너뜁니다."
            exit 0
          fi

          # 규칙: 접두사/기능명 (소문자, 하이픈)
          # ex) feat/anonymous-user-upgrade
          PATTERN='^(feat|fix|refactor|docs|chore)/[a-z0-9]+(-[a-z0-9]+)*$'
          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ 브랜치명 규칙을 준수합니다."
          else
            echo "::error::브랜치명이 규칙에 맞지 않습니다: $BRANCH"
            echo "::error::올바른 형식: 접두사/기능명 (소문자, 하이픈)"
            echo "::error::예시: feat/anonymous-user-upgrade"
            echo "::error::허용 접두사: feat, fix, refactor, docs, chore"
            exit 1
          fi